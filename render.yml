services:
  # PostgreSQL Database (Render-native, more reliable than MySQL)
  # If you prefer MySQL, comment this out and use external database
  - type: pserv
    name: inventory-postgres
    runtime: postgres15
    ipAllowList: []
    plan: free

  # Django Backend API Server
  - type: web
    name: inventory-api
    runtime: python
    pythonVersion: 3.10
    
    # Build and start commands
    buildCommand: >
      cd backend &&
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    
    startCommand: >
      cd backend &&
      gunicorn inventory_system.wsgi:application \
        --bind 0.0.0.0:$PORT \
        --workers 4 \
        --worker-class sync \
        --timeout 60 \
        --access-logfile - \
        --error-logfile -
    
    # Environment variables
    envVars:
      - key: SECRET_KEY
        generateValue: true
      
      - key: DEBUG
        value: "False"
      
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-postgres
          property: connectionString
      
      - key: WEB_CONCURRENCY
        value: 4
      
      - key: DJANGO_SETTINGS_MODULE
        value: inventory_system.settings
      
      - key: PYTHON_VERSION
        value: "3.10"
    
    # Health check
    healthCheckPath: /api/dashboard/stats/
    
    # Disk and memory
    plan: free
    disk:
      name: inventory-storage
      mountPath: /app/storage
      sizeGB: 1

  # Optional: Static File Server (if not using WhiteNoise)
  # Uncomment to serve frontend as separate service
  # - type: web
  #   name: inventory-frontend
  #   runtime: static
  #   buildCommand: "cd frontend && npm install && npm run build"
  #   staticPublishPath: frontend/dist
  #   routes:
  #     - path: /
  #       priority: 2

# Database configuration (commented - using Render's PostgreSQL above)
# If you want MySQL instead, uncomment and configure:
# databases:
#   - name: inventory-mysql
#     databaseName: inventory_db
#     user: inventory_user
#     version: "8.0"

# Note: This configuration uses PostgreSQL instead of MySQL because:
# 1. Render provides native PostgreSQL support with free tier
# 2. More reliable database handling
# 3. Better performance and scalability
#
# If you need MySQL:
# - Use external MySQL service (AWS RDS, DigitalOcean, etc.)
# - Update DATABASE_URL environment variable
# - Update DATABASES setting in Django to support PostgreSQL or MySQL
#
# For MySQL, change:
#   ENGINE: 'django.db.backends.mysql' 
# To:
#   ENGINE: 'django.db.backends.postgresql'
